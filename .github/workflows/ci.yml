name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Change detection. A pull request that only touches documentation,
  # images or repository metadata skips the build steps below. Every
  # job still runs and reports, because branch protection requires each
  # check by name and a skipped matrix job would report under its
  # unexpanded name instead. Pushes to main always build. The list
  # names what is NOT code, so an unknown path builds (fail-safe).
  # -------------------------------------------------------------------
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: full build."
            exit 0
          fi
          base="origin/${GITHUB_BASE_REF}"
          if ! files=$(git diff --name-only "$base"...HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not diff against $base; building."
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # The man page is built and installed by meson.
              docs/man/*) code=true ;;
              *.md | docs/* | *.png | *.svg | *.jpg | *.jpeg | *.gif | \
              LICENSE | CITATION.cff | MAINTAINERS | \
              .github/CODEOWNERS | .github/ISSUE_TEMPLATE/* | \
              .github/dependabot.yml) ;;
              *) code=true ;;
            esac
            echo "$f"
          done <<< "$files"
          [ -n "$files" ] || code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "Code paths changed: full build."
          else
            echo "Documentation-only change: build steps are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # -------------------------------------------------------------------
  # Native Ubuntu — primary build matrix
  # -------------------------------------------------------------------
  build-ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }} • ${{ matrix.compiler }} • eBPF=${{ matrix.ebpf }}
    runs-on: ${{ matrix.runner }}
    needs: changes
    env:
      BUILD: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            runner: ubuntu-24.04
            compiler: gcc
            ebpf: enabled
          - ubuntu: '24.04'
            runner: ubuntu-24.04
            compiler: clang
            ebpf: enabled
          - ubuntu: '24.04'
            runner: ubuntu-24.04
            compiler: gcc
            ebpf: disabled
          # Ubuntu 22.04 (jammy) ships libbpf 0.5.0; our minimum is
          # 0.8 (per ADR-0003). With -Dwith_ebpf=auto, meson resolves
          # to disabled and prints an explanatory message; this cell
          # verifies that path end-to-end. The matching loud-fail
          # path (-Dwith_ebpf=enabled) is exercised by the separate
          # build-ubuntu-jammy-fail-loud job below.
          - ubuntu: '22.04'
            runner: ubuntu-22.04
            compiler: gcc
            ebpf: auto
    steps:
      - name: Documentation-only change
        if: env.BUILD != 'true'
        run: echo "No code paths changed; build skipped."

      - uses: actions/checkout@v7
        if: env.BUILD == 'true'

      - name: Install build dependencies
        if: env.BUILD == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              meson ninja-build pkg-config \
              gcc clang \
              libbpf-dev linux-tools-generic \
              libelf-dev zlib1g-dev \
              libmicrohttpd-dev \
              python3 \
              cppcheck shellcheck clang-format

      - name: Configure
        if: env.BUILD == 'true'
        env:
          CC: ${{ matrix.compiler }}
        run: |
          meson setup build \
              -Dwith_ebpf=${{ matrix.ebpf }} \
              -Dwith_tests=true \
              -Dwith_examples=true \
              -Dwerror=true 2>&1 | tee meson-setup.log

      - name: Verify smart-fallback message (jammy + auto only)
        if: env.BUILD == 'true' && matrix.ubuntu == '22.04' && matrix.ebpf == 'auto'
        run: |
          grep -q 'eBPF backends disabled' meson-setup.log
          grep -q 'PKG_CONFIG_PATH' meson-setup.log
          echo "OK: configure announced the auto-downgrade as expected."

      - name: Compile
        if: env.BUILD == 'true'
        run: meson compile -C build -v

      - name: Smoke-test the binary
        if: env.BUILD == 'true'
        run: |
          ./build/src/cli/intp --version
          ./build/src/cli/intp --help
          ./build/src/cli/intp --print-schema

      - name: Run test suite
        if: env.BUILD == 'true'
        run: meson test -C build --print-errorlogs

      - name: Verify pkg-config resolution
        if: env.BUILD == 'true'
        run: |
          PKG_CONFIG_PATH="$(pwd)/build/meson-private" \
              pkg-config --cflags --libs intp

      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.ubuntu }}-${{ matrix.compiler }}-ebpf-${{ matrix.ebpf }}
          path: build/meson-logs/

  # -------------------------------------------------------------------
  # Negative test — on a host with too-old libbpf, -Dwith_ebpf=enabled
  # MUST fail at configure time with a recognisable message. This
  # locks in the loud-fail half of ADR-0003's smart-fallback policy
  # so a future refactor can't silently turn the loud path into the
  # silent path.
  # -------------------------------------------------------------------
  build-ubuntu-jammy-fail-loud:
    name: Ubuntu 22.04 • eBPF=enabled (must fail loud)
    runs-on: ubuntu-22.04
    needs: changes
    # Not a matrix job, so a job-level skip reports under its real name
    # and satisfies the required check.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              meson ninja-build pkg-config gcc \
              libbpf-dev libelf-dev zlib1g-dev \
              libmicrohttpd-dev python3

      - name: Configure with -Dwith_ebpf=enabled (expect failure)
        run: |
          set +e
          meson setup build -Dwith_ebpf=enabled 2>&1 | tee meson-setup.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "0" ]; then
            echo "::error::meson should have refused -Dwith_ebpf=enabled on jammy (libbpf 0.5)."
            exit 1
          fi
          # Make sure we failed for the right reason, not some unrelated breakage.
          grep -qi 'libbpf' meson-setup.log || {
            echo "::error::meson failed but the log does not mention libbpf — check meson-setup.log."
            exit 1
          }
          echo "OK: meson refused to build with -Dwith_ebpf=enabled, as required by ADR-0003."

  # -------------------------------------------------------------------
  # Container builds — exercise the distro packaging assumptions early.
  # -------------------------------------------------------------------
  build-container:
    name: ${{ matrix.image }} • eBPF=${{ matrix.ebpf }}
    runs-on: ubuntu-24.04
    needs: changes
    env:
      BUILD: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            install: |
              apt-get update && apt-get install -y --no-install-recommends \
                  meson ninja-build pkg-config gcc clang \
                  libbpf-dev bpftool libelf-dev zlib1g-dev \
                  libmicrohttpd-dev python3 ca-certificates
            ebpf: enabled
          - image: fedora:latest
            install: |
              dnf -y install \
                  meson ninja-build pkgconf-pkg-config gcc clang \
                  libbpf-devel bpftool elfutils-libelf-devel zlib-devel \
                  libmicrohttpd-devel python3
            ebpf: enabled
          - image: alpine:latest
            install: |
              apk add --no-cache \
                  meson ninja pkgconf gcc clang musl-dev linux-headers \
                  elfutils-dev zlib-dev libmicrohttpd-dev python3
            ebpf: disabled
    container:
      # A docs-only run pulls the small Alpine image instead of the
      # distro under test; its steps are skipped either way.
      image: ${{ needs.changes.outputs.code == 'true' && matrix.image || 'alpine:latest' }}
    steps:
      - name: Documentation-only change
        if: env.BUILD != 'true'
        run: echo "No code paths changed; build skipped."

      - uses: actions/checkout@v7
        if: env.BUILD == 'true'

      - name: Install build dependencies
        if: env.BUILD == 'true'
        run: ${{ matrix.install }}

      - name: Configure
        if: env.BUILD == 'true'
        run: |
          meson setup build \
              -Dwith_ebpf=${{ matrix.ebpf }} \
              -Dwith_tests=true \
              -Dwith_examples=true

      - name: Compile
        if: env.BUILD == 'true'
        run: meson compile -C build -v

      - name: Smoke-test the binary
        if: env.BUILD == 'true'
        run: |
          ./build/src/cli/intp --version
          ./build/src/cli/intp --help
          ./build/src/cli/intp --print-schema

      - name: Run test suite
        if: env.BUILD == 'true'
        run: meson test -C build --print-errorlogs

  # -------------------------------------------------------------------
  # Lint pass — separate job so a single PR sees all lint failures.
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: changes
    env:
      BUILD: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version sources agree
        run: scripts/check-versions.sh

      - name: Install lint dependencies
        if: env.BUILD == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              clang-format cppcheck shellcheck

      - name: clang-format
        if: env.BUILD == 'true'
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          mapfile -t files < <(git diff --name-only --diff-filter=AM \
              "$base"...HEAD -- '*.c' '*.h' \
              ':!src/backends/ebpf/intp_agg.bpf.[ch]' \
              ':!src/backends/ebpf/vmlinux/*' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C/H files changed; skipping."
            exit 0
          fi
          clang-format --dry-run -Werror "${files[@]}"

      - name: cppcheck
        if: env.BUILD == 'true'
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 --inline-suppr -q \
                   --suppress=missingIncludeSystem \
                   -I include src/ examples/ || true
          # NB: while the source tree is largely stubs (Stage 1.5),
          # cppcheck runs in an advisory capacity. Switch to
          # exit-code 1 once Stage 2 lands real code.

      - name: shellcheck
        if: env.BUILD == 'true'
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'tools/*' || true)
          if [ ${#files[@]} -gt 0 ]; then
            # warnings and errors fail; style/info notes are advisory
            shellcheck --severity=warning "${files[@]}"
          else
            echo "No shell scripts to check yet."
          fi
