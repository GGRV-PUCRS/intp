name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild the release for an existing tag with the current workflow
  # (for a tag pushed while this workflow was broken, for example).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.10.0-beta1)'
        required: true
        type: string

permissions:
  contents: write

# The release is created as a draft: the maintainer attaches detached
# GPG signatures (.asc) for the tarballs and publishes it by hand. See
# docs/PACKAGING.md, "GitHub release".
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # -------------------------------------------------------------------
  # Build static binaries for x86_64 and aarch64.
  # -------------------------------------------------------------------
  binaries:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-24.04
            cross_file: ''
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
            cross_file: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # bpftool is only a virtual package on Ubuntu 24.04;
      # linux-tools-generic provides it (as in ci.yml).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              meson ninja-build pkg-config gcc clang \
              libbpf-dev linux-tools-generic libelf-dev zlib1g-dev \
              libmicrohttpd-dev python3

      - name: Configure (static)
        run: |
          meson setup build \
              --buildtype=release \
              --prefix=/usr \
              -Dwith_ebpf=enabled \
              -Dwith_static=true \
              -Dwith_tests=false \
              -Dwith_examples=false

      - name: Compile
        run: meson compile -C build -v

      - name: Smoke-test
        run: |
          ./build/src/cli/intp --version
          ./build/src/cli/intp --print-schema

      - name: Stage release artefact
        run: |
          version="${TAG#v}"
          mkdir -p "intp-${version}-${{ matrix.arch }}"
          cp build/src/cli/intp "intp-${version}-${{ matrix.arch }}/"
          cp LICENSE README.md "intp-${version}-${{ matrix.arch }}/"
          tar -czf "intp-${version}-${{ matrix.arch }}.tar.gz" \
              "intp-${version}-${{ matrix.arch }}/"
          sha256sum "intp-${version}-${{ matrix.arch }}.tar.gz" \
              > "intp-${version}-${{ matrix.arch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: |
            intp-*.tar.gz
            intp-*.tar.gz.sha256

  # -------------------------------------------------------------------
  # Source tarball (for distro packagers and reproducible builds).
  # -------------------------------------------------------------------
  source-tarball:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # meson setup still probes libmicrohttpd (with_prometheus defaults
      # to on), so it must be installed even though nothing is compiled.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              meson ninja-build pkg-config libmicrohttpd-dev

      - name: Generate dist tarball
        run: |
          meson setup build -Dwith_ebpf=disabled -Dwith_tests=false
          meson dist -C build --no-tests --formats gztar
          mv build/meson-dist/*.tar.gz .
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # -------------------------------------------------------------------
  # Publish — collect every artefact and create the GitHub release.
  # -------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [binaries, source-tarball]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: artefacts/

      - name: Move artefacts to flat directory
        run: |
          mkdir -p release
          find artefacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
              -exec cp {} release/ \;
          ls -l release/

      - name: Extract changelog entry for this tag
        id: changelog
        run: |
          version="${TAG#v}"
          # Pull the section between `## [version]` and the next `## ` header.
          awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { in_block=1; next }
              in_block && /^## / { exit }
              in_block { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for ${version}; using a default note." >&2
            printf "Release %s.\n" "$version" > release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: intp ${{ env.TAG }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
